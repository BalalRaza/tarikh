name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tarikh-poc/package-lock.json
      - run: npm ci && npm run build
        working-directory: tarikh-poc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tarikh-poc/dist
      - id: d
        uses: actions/deploy-pages@v4
